<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RniType HUD</title>
  <link rel="stylesheet" href="../shared/fonts.css" />
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="hud.css" />
</head>
<body>
  <!--
    HUD overlay — วาดจาก HudState เท่านั้น (read-only, click-through)
    โครงสร้าง: stage (ยึดที่ pivot + scale) → ring (SVG) + pill (aria-live)
  -->
  <main id="hud" class="hud" data-mode="disabled" data-state="idle" data-visible="false" data-rings="off" data-preview="off">
    <div class="hud__stage" id="stage">
      <div class="hud__glass" aria-hidden="true"></div>
      <svg class="hud__ring" viewBox="-170 -170 340 340" aria-hidden="true" focusable="false">
        <g id="outerRing"></g>
        <g id="innerRing"></g>
        <g id="cmdRing" class="cmd-ring"></g>
        <g id="langRing" class="lang-ring"></g>
        <g class="hud__center">
          <circle class="center__track" r="27" />
          <circle class="center__halo" r="3.5" />
        </g>
        <text class="hud__preview" id="previewChar" x="0" y="-4" text-anchor="middle" dominant-baseline="central"></text>
        <text class="hud__repeat" id="previewCount" x="0" y="16" text-anchor="middle" dominant-baseline="central"></text>
      </svg>

      <div class="hud__status" id="pill" aria-live="polite">
        <span class="chip chip--status">
          <b id="pillMode"></b>
          <span class="pill__part" id="pillText"></span>
          <span class="pill__part" id="pillLang"></span>
          <span class="pill__badges" id="pillBadges"></span>
        </span>
      </div>
    </div>
  </main>

  <div id="pointer" class="pointer" data-visible="false" aria-hidden="true"><i></i></div>
  <div id="pivot" class="pivot" data-visible="false" aria-hidden="true"></div>

  <script src="../shared/fonts.js"></script>
  <script src="hud.js"></script>
</body>
</html>

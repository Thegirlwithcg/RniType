[workspace]
resolver = "3"
members = ["crates/rnitype-core", "crates/rnitype-probe", "crates/rnitype-win", "crates/rnitype-app"]

[workspace.package]
version = "0.3.8"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"

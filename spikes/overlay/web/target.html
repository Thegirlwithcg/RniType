<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spike B — target</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Leelawadee UI", system-ui, sans-serif; }
    html, body { margin: 0; height: 100%; background: #11161e; color: #eef2f7; }
    main {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      box-sizing: border-box;
      text-align: center;
    }
    h1 { font-size: 15px; margin: 0; color: #9aa4b2; font-weight: 600; }
    button {
      width: min(520px, 90%);
      height: 96px;
      font: inherit;
      font-size: 20px;
      font-weight: 700;
      color: #06211d;
      background: #5eead4;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    #out { font-size: 13px; color: #8b93a1; min-height: 18px; }
    #out.pass { color: #5eead4; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Target window — อยู่ใต้ overlay</h1>
    <button id="hit">คลิกที่นี่</button>
    <div id="out">ยังไม่ได้รับคลิก</div>
  </main>

  <script>
    const invoke = window.__TAURI__.core.invoke;
    let count = 0;

    document.getElementById('hit').addEventListener('click', async () => {
      count += 1;
      const out = document.getElementById('out');
      out.textContent = `PASS — ได้รับคลิก ${count} ครั้ง (foreground = target)`;
      out.classList.add('pass');
      try {
        await invoke('report_target_click');
      } catch (e) {
        out.textContent = 'ERROR: ' + e;
        out.classList.remove('pass');
      }
    });
  </script>
</body>
</html>
